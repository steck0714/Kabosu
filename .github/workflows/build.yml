name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Fast guard: the bot must keep compiling for aarch64 (the Switch CPU).
  # Uses the Linux cross compiler, so it checks the C++ and the intrinsics,
  # not libnx. The real libnx build is the next job.
  bot-aarch64-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install aarch64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-aarch64-linux-gnu
      - name: Syntax-check every bot source for aarch64
        run: |
          set -e
          for f in third_party/lemon-tea/bot/*.cpp; do
            echo "== $f"
            aarch64-linux-gnu-g++ -std=c++20 -fsyntax-only -Wall "$f"
          done

  # Real Switch build with devkitA64 + libnx. Produces a homebrew .nro.
  selftest-nro:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    env:
      DEVKITPRO: /opt/devkitpro
    steps:
      - uses: actions/checkout@v4
      - name: Make sure libnx is installed
        run: dkp-pacman -Sy --noconfirm --needed switch-dev
      - name: Build selftest
        run: make -C selftest
      - uses: actions/upload-artifact@v4
        with:
          name: kabosu-selftest
          path: selftest/kabosu-selftest.nro
